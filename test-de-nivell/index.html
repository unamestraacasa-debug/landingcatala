<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruleta ACat · ¿Cuánto sabes de Andorra y del catalán?</title>
<meta name="description" content="Juega gratis a la Ruleta ACat: gira y gana 6 quesitos sobre Andorra y el catalán del día a día. Sin registro, en 1 minuto, y al final tu plan para hablar catalán.">
<link rel="canonical" href="https://aprencat.com/test-de-nivell/">
<meta property="og:title" content="Ruleta ACat · ¿Cuánto sabes de Andorra y del catalán?">
<meta property="og:description" content="6 quesitos, 1 minuto, sin registro. ¿Los consigues todos?">
<meta property="og:type" content="website">
<meta property="og:url" content="https://aprencat.com/test-de-nivell/">
<meta property="og:image" content="https://aprencat.com/assets/acat-wordmark.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap">
<style>
:root{--navy:#0B2D6B;--navy-2:#123A82;--groc:#F6C86B;--corall:#F28B6B;--lavanda:#A7B6E8;--crema:#FFF6E7;--corall-fosc:#D4552C;--blau:#5F78C4;--ink:#14213F;--muted:#5E6B8C;--line:#E5E9F3;--ok:#2E8B57;--ok-bg:#E8F5EE;--ko:#C2462A;--ko-bg:#FDEDE8;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Sora",-apple-system,system-ui,sans-serif;font-size:17px;line-height:1.5;background:#FBFCFE;padding:0 16px 32px}
body.dark{background:var(--navy);color:#fff}
.wrap{max-width:460px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0}
header img{height:26px;width:auto;display:block}
body.dark header img{filter:brightness(0) invert(1)}
select{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:8px 14px;background:#fff;color:var(--ink)}
.hide{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:inherit;font-size:17px;font-weight:800;border:0;border-radius:18px;min-height:58px;padding:0 24px;cursor:pointer;background:var(--navy);color:#fff;text-decoration:none;width:100%}
.btn:disabled{background:#C9D0E2;cursor:default}
.btn.corall{background:var(--corall);color:var(--navy)}
.btn.ghost{background:transparent;color:#fff;border:2px solid var(--lavanda);min-height:54px;font-size:16px;font-weight:700}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.link{display:block;margin-top:14px;text-align:center;color:var(--muted);font-size:15px;font-weight:600}
body.dark .link{color:var(--lavanda)}
.kicker{display:block;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
body.dark .kicker{color:var(--lavanda)}
h1{margin:6px 0 0;font-size:clamp(30px,8vw,36px);line-height:1.12;letter-spacing:-.02em;font-weight:800}
h2{margin:0;font-size:clamp(21px,5.6vw,25px);line-height:1.25;font-weight:800;color:var(--navy);text-wrap:balance}
/* Roda de formatgets */
.wheel{display:block}
.wheel path{stroke-linejoin:round;transition:fill .4s ease}
/* La roda petita s’ajusta al disc també en pantalles baixes. */
.qhead .disc > span{width:calc(100% - 8px);height:calc(100% - 8px);display:grid;place-items:center}
.qhead .disc .wheel{width:100%;height:100%}
.disc{border-radius:50%;background:var(--navy-2);display:grid;place-items:center;flex:none}
/* Portada */
.hero{position:relative;height:290px;display:flex;align-items:center;justify-content:center;margin-top:6px}
.hero .tag{position:absolute;font-size:12px;font-weight:800;color:var(--navy);border-radius:999px;padding:6px 10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
#s-intro .kicker,#s-intro h1{text-align:center}
#s-intro .chips{justify-content:center}
.chips span{font-size:13px;font-weight:600;border:1px solid rgba(167,182,232,.5);color:var(--crema);border-radius:999px;padding:6px 12px}
/* Pregunta */
.top{display:flex;justify-content:space-between;align-items:center}
.pills{display:flex;gap:8px;align-items:center}
.pill{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:800;border-radius:999px;padding:8px 12px;background:var(--crema);color:var(--navy)}
.pill.solid{background:var(--navy);color:#fff}
.pill svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.qhead{display:flex;align-items:center;gap:14px;margin-top:18px}
.cat{align-self:flex-start;font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--navy);border-radius:999px;padding:6px 12px}
.sub{font-size:14px;font-weight:700;color:var(--muted)}
.qbox{margin-top:26px;background:var(--navy);border-radius:26px;padding:22px 20px;color:#fff}
.qbox .q{margin:0;font-size:clamp(21px,5.6vw,24px);line-height:1.3;font-weight:800}
.qbox .ca{color:var(--groc)}
.opts{display:grid;gap:12px;margin-top:18px}
.opt{font:inherit;display:flex;align-items:center;gap:14px;text-align:left;padding:12px 16px;border-radius:18px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;min-height:62px;font-size:18px;font-weight:700}
.opt .k{width:34px;height:34px;border-radius:11px;background:var(--crema);color:var(--navy);font-weight:800;display:grid;place-items:center;flex:none;font-size:15px}
.opt .k svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.opt:hover:not(:disabled){border-color:var(--lavanda)}
.opt.right{background:var(--navy);border-color:var(--navy);color:#fff}
.opt.right .k{background:var(--groc)}
.opt.wrong{background:var(--ko-bg);border-color:var(--ko)}
.opt.dim{opacity:.45}
.opt:disabled{cursor:default}
.opt .plus{margin-left:auto;color:var(--groc);font-weight:800;font-size:15px}
.verdict{margin:16px 0 0;font-size:28px;font-weight:800;letter-spacing:-.01em}
.verdict.ok{color:var(--corall)}.verdict.ko{color:var(--navy)}
.fact{margin-top:10px;background:var(--crema);border-radius:22px;padding:16px;display:grid;gap:6px;font-size:15px}
.fact .h{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--navy)}
.fact .h i{width:32px;height:32px;border-radius:10px;background:var(--navy);display:grid;place-items:center}
.fact .h svg{width:17px;height:17px;fill:none;stroke:var(--groc);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fact p{margin:0}
.fact .ca{color:var(--muted);font-size:14px}
.fact .ca b{color:var(--navy)}
.actions{margin-top:18px}
/* Sense scroll entre preguntes: en respondre s'amaguen les opcions descartades i tot es compacta. */
#s-q.answered .opt.dim{display:none}
#s-q.answered .qhead{margin-top:10px}
#s-q.answered .qbox{margin-top:24px;padding:16px 18px}
#s-q.answered .opts{margin-top:12px;gap:10px}
#s-q.answered .verdict{margin-top:10px;font-size:24px;line-height:1.2}
#s-q.answered .fact{padding:12px 14px;gap:4px;font-size:14.5px;line-height:1.45}
#s-q.answered .actions{margin-top:12px}
@media (max-height:740px){
 .qhead{margin-top:10px}.qhead .disc{width:60px!important;height:60px!important}
 .qbox{margin-top:22px;padding:16px 18px}.opts{margin-top:12px;gap:10px}.opt{min-height:54px;padding:9px 14px}
 .spin-stage{margin-top:12px}#spinStage .btn{margin-top:14px}
 #s-q.answered .fact .h{display:none}
}
@media (max-height:660px){#s-q.answered .qhead{display:none}#s-q.answered .top{margin-bottom:4px}}
body:has(#s-q:not(.hide)){padding-bottom:12px}
/* Resultat */
.center{text-align:center;display:flex;flex-direction:column;align-items:center}
.badge{margin-top:16px;font-size:clamp(26px,7vw,30px);line-height:1.15;font-weight:800}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.stats span{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;background:rgba(167,182,232,.18);border-radius:999px;padding:8px 14px}
.stats svg{width:16px;height:16px;fill:none;stroke:var(--groc);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stack{display:grid;gap:12px;width:100%;margin-top:26px}
#s-score #toProfile{margin-top:16px}
.toast{margin-top:10px;font-size:14px;font-weight:700;color:var(--groc)}
/* Perfil */
.card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:24px 20px;box-shadow:0 10px 30px rgba(20,33,63,.06)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 20px}
.bar i{display:block;height:100%;width:0;background:var(--navy);border-radius:99px;transition:width .35s}
.hint{font-size:14px;font-weight:600;color:var(--muted);margin:0 0 4px}
.popt{font:inherit;font-size:16px;text-align:left;padding:13px 16px;border-radius:16px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:12px}
.popt .ico{flex:none;width:40px;height:40px;border-radius:12px;background:var(--crema);color:var(--navy);display:grid;place-items:center;font-size:14px;font-weight:800}
.popt .ico svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.popt.sel{border-color:var(--navy);background:#EEF1FA}
.popt.sel .ico{background:var(--navy);color:var(--groc)}
.loading{text-align:center;padding:30px 0}
.loading ul{list-style:none;padding:0;margin:20px auto 0;max-width:340px;text-align:left;display:grid;gap:12px}
.loading li{opacity:.25;font-weight:600;transition:opacity .3s}
.loading li.on{opacity:1}
.loading li::before{content:"✓";display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ok-bg);color:var(--ok);font-weight:800;margin-right:10px;font-size:14px}
.spin{width:54px;height:54px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--navy);margin:0 auto;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
/* Pla */
.how{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:8px}
.how li{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 12px;font-size:14px;line-height:1.4}
.how li i{width:36px;height:36px;border-radius:10px;background:var(--crema);display:grid;place-items:center;flex:none}
.how li svg{width:20px;height:20px;fill:none;stroke:var(--navy);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.how b{color:var(--navy)}
.rec{margin-top:12px;padding:14px 16px;border-radius:16px;background:var(--crema);font-size:15px}
.offer{margin-top:14px;background:var(--navy);border-radius:22px;padding:16px 18px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px}
.offer .t{font-size:20px;font-weight:800;line-height:1.15}.offer .t span:first-child{color:var(--groc)}.offer .t span:last-child{color:var(--corall)}
.offer .s{font-size:13px;font-weight:700;color:var(--lavanda);margin-top:6px}
.offer .p{font-size:30px;font-weight:800;white-space:nowrap}
.plans{display:grid;gap:12px;margin-top:14px}
.plan{background:#fff;border:2px solid var(--line);border-radius:20px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.plan.on{border-color:var(--navy);box-shadow:0 10px 26px rgba(11,45,107,.14)}
.plan .tag{grid-column:1/-1;justify-self:start;font-size:11px;font-weight:800;letter-spacing:.06em;background:var(--groc);color:var(--navy);border-radius:999px;padding:3px 10px;margin-bottom:4px}
.plan h3{margin:0;font-size:20px;color:var(--navy)}
.plan .d{font-size:13px;color:var(--muted);grid-column:1}
.plan .pr{grid-row:span 2;text-align:right;font-weight:800;font-size:22px;color:var(--navy);white-space:nowrap}
.plan .pr del{display:block;font-size:13px;font-weight:600;color:var(--muted)}
.plan .btn{grid-column:1/-1;margin-top:10px;min-height:50px;font-size:15px}
.plan .btn.big{min-height:64px;font-size:19px;font-weight:800;background:var(--corall);color:var(--navy);box-shadow:0 10px 22px rgba(242,139,107,.35)}
#free{margin-top:8px;font-size:12px;font-weight:500;opacity:.8}
.plan:not(.on) .btn{background:#EEF1FA;color:var(--navy)}
.once{text-align:center;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 0}
.preview{background:var(--groc);color:var(--navy);font-weight:800;text-align:center;border-radius:12px;padding:8px;margin-top:14px;font-size:13px}
/* Selecció de plans compacta, amb desplaçament de reserva per a text ampliat. */
#s-plan:not(.hide){position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(11,45,107,.62)}
.plans-dialog{position:relative;width:min(100%,440px);max-height:calc(100dvh - 24px);overflow:auto;background:#fff;border-radius:24px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.plans-close{position:absolute;right:12px;top:10px;width:44px;height:44px;border:0;background:transparent;color:var(--navy);font:inherit;font-size:25px;cursor:pointer}
#s-plan .kicker{font-size:11px;padding-right:44px}
#s-plan h2{font-size:clamp(18px,5vw,22px);line-height:1.2}
#s-plan .how,#s-plan .rec{display:none}
#s-plan .plans{gap:6px;margin-top:10px}
#s-plan .plan{padding:7px 10px;border-radius:13px;gap:0 8px;grid-template-columns:minmax(0,1fr) auto auto;box-shadow:none}
#s-plan .plan .tag{grid-column:1/-1;margin:0;font-size:9px;padding:1px 6px}
#s-plan .plan h3{font-size:15px}
#s-plan .plan .d{font-size:11px;grid-column:1}
#s-plan .plan .pr{font-size:15px;grid-column:2;grid-row:span 2}
#s-plan .plan .pr del{font-size:10px}
#s-plan .plan .btn,#s-plan .plan .btn.big{grid-column:3;grid-row:span 2;margin:0;min-height:44px;width:auto;padding:0 10px;font-size:12px;line-height:1.1;box-shadow:none}
#s-plan .offer{margin-top:8px;padding:9px 12px;border-radius:14px}
#s-plan .offer .t{font-size:15px}#s-plan .offer .s{font-size:11px;margin-top:2px}#s-plan .offer .p{font-size:22px}
#s-plan .preview{margin-top:6px;padding:4px;font-size:10px}
#s-plan .once{margin:8px 0 0;font-size:11px}
#s-plan #free{margin-top:6px;font-size:12px}
/* Personatges */
.char{position:absolute;height:auto;pointer-events:none;filter:drop-shadow(0 10px 14px rgba(0,0,0,.25))}
.hero .char{bottom:-6px;width:auto;height:200px}
.char-l{left:-8px}.char-r{right:-8px}
.wave{animation:charIn .7s cubic-bezier(.2,1.3,.4,1) both}
.char-r.wave{animation-delay:.15s}
@keyframes charIn{0%{transform:translateY(60px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
.scorewrap{position:relative;width:100%;height:250px;display:flex;justify-content:center;align-items:center;margin-top:12px}
.scorewrap .char{height:176px;width:auto;bottom:-4px}
/* Cada personatge ocupa la meitat del recurs compartit, amb fons transparent. */
.hero .char,.scorewrap .char{width:115px;object-fit:cover}
.char-l,.scorewrap .jl{object-position:24% center}
.char-r,.scorewrap .jr{object-position:76% center}
.jl{left:-4px}.jr{right:-4px}
.celebrate .jump{animation:jumpIn .6s cubic-bezier(.2,1.4,.4,1) both .35s,hop .9s ease-in-out 1.0s 4}
.celebrate .jr{animation-delay:.5s,1.15s}
@keyframes jumpIn{0%{transform:translateY(80px) scale(.5);opacity:0}100%{transform:none;opacity:1}}
@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-22px)}}
.snd{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--navy)}
.snd svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* Ruleta */
.spin-stage{display:flex;flex-direction:column;align-items:center;margin-top:22px;gap:0}
.pointer{position:relative;z-index:2;width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:30px solid var(--corall);margin-bottom:-16px;filter:drop-shadow(0 3px 3px rgba(11,45,107,.3))}
.rwrap{width:290px;height:290px;border-radius:50%;background:var(--navy);display:grid;place-items:center;box-shadow:0 16px 40px rgba(11,45,107,.25);transition:transform 2.6s cubic-bezier(.12,.75,.18,1)}
.spin-stage .btn{margin-top:26px}
.qarea-in{animation:popIn .45s cubic-bezier(.2,1.4,.4,1) both}
/* Pop-ups i celebració */
#pop{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:50;padding:24px}
.popcard{pointer-events:auto;background:var(--navy);color:#fff;border-radius:30px;padding:26px 28px;min-width:260px;max-width:340px;text-align:center;box-shadow:0 24px 60px rgba(11,45,107,.35);animation:popIn .45s cubic-bezier(.2,1.4,.4,1) both}
.popcard.out{animation:popOut .25s ease-in both}
.popcard .pi{width:84px;height:84px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center}
.popcard .pi svg{width:42px;height:42px;fill:none;stroke:var(--navy);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.popcard .pt{font-size:26px;font-weight:800;line-height:1.15}
.popcard .ps{margin-top:6px;font-size:16px;font-weight:700;color:var(--lavanda)}
.popcard .pp{display:inline-block;margin-top:12px;font-size:20px;font-weight:800;color:var(--navy);background:var(--groc);border-radius:999px;padding:6px 16px}
.popcard .pk{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px;font-size:16px;font-weight:800;color:var(--groc)}
.popcard .pk svg{width:20px;height:20px;fill:none;stroke:var(--groc);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@keyframes popIn{0%{transform:scale(.4) rotate(-6deg);opacity:0}70%{transform:scale(1.06) rotate(1deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes popOut{to{transform:scale(.7);opacity:0}}
.floatpts{position:absolute;right:16px;top:-6px;font-weight:800;color:var(--corall);font-size:22px;animation:floatUp 1s ease-out forwards;pointer-events:none}
.opt{position:relative}
@keyframes floatUp{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-46px);opacity:0}}
.pill.bump{animation:bump .4s ease}
@keyframes bump{50%{transform:scale(1.25)}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.congrats{margin:8px 0 0;font-size:clamp(34px,9vw,42px);font-weight:800;letter-spacing:-.02em;color:var(--groc)}
.celebrate .congrats{animation:popIn .6s cubic-bezier(.2,1.4,.4,1) both}
.celebrate .disc{animation:spinIn .9s cubic-bezier(.2,1.2,.4,1) both .15s}
.celebrate .badge{animation:popIn .5s cubic-bezier(.2,1.4,.4,1) both .7s}
.celebrate .stats{animation:popIn .5s ease both .95s}
@keyframes spinIn{0%{transform:scale(.3) rotate(-200deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@media (prefers-reduced-motion:reduce){.wheel path,.bar i,.loading li{transition:none}.spin{animation:none}.popcard,.popcard.out,.floatpts,.pill.bump,.celebrate .congrats,.celebrate .disc,.celebrate .badge,.celebrate .stats{animation:none}.rwrap{transition:none}.qarea-in{animation:none}.wave,.celebrate .jump{animation:none}}
</style>
</head>

    $("congrats").textContent = tx.congrats[badgeIdx()];
    const missing = [0,1,2,3,4,5].filter(i => !won.has(i)).map(i => tx.cats[i]);
    $("badgeSub").textContent = (n === 6 ? tx.all : fill(tx.missing, {n, c: missing.join(", ")})) + " " + tx.badgeSub[badgeIdx()];
    $("statStreak").innerHTML = svg("flame") + fill(tx.streak, {n: bestStreak});
    $("statPts").innerHTML = svg("star") + fill(tx.pts, {n: points});
  }
  $("share").onclick = async () => {
    const url = "https://aprencat.com/test-de-nivell/?utm_source=share&utm_campaign=ruleta&lang=" + lang;
    const text = fill(t().shareText, {n: won.size});
    try {
      if (navigator.share) { await navigator.share({title: "Ruleta ACat", text, url}); return; }
      await navigator.clipboard.writeText(text + " " + url);
      $("toast").classList.remove("hide");
    } catch (e) { /* L'usuari ha cancel·lat o no hi ha porta-retalls. */ }
  };
  $("again").onclick = e => { e.preventDefault(); reset(); renderQ(); show("q"); };
  $("toProfile").onclick = () => { pstep = 0; renderProfile(); show("profile"); };

  // ---------- Perfil ----------
  function renderProfile() {
    const tx = t(), st = PROFILE[pstep], q = tx.p[st.id], sel = A[st.id];
    $("pcount").textContent = fill(tx.pcount, {n: pstep + 1});
    $("pbar").style.width = ((pstep) / PROFILE.length * 100) + "%";
    $("phint").textContent = st.type === "multi" ? tx.multi : tx.one;
    $("pq").textContent = q.q;
    $("popts").replaceChildren(...q.o.map((label, j) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "popt";
      const on = st.type === "multi" ? (sel || []).includes(j) : sel === j;
      if (on) b.classList.add("sel"); b.setAttribute("aria-pressed", on);
      const i = document.createElement("span"); i.className = "ico"; i.setAttribute("aria-hidden", "true");
      const icon = PICONS[st.id][j]; if (SVG[icon]) i.innerHTML = svg(icon); else i.textContent = icon;
      const s = document.createElement("span"); s.textContent = label;
      b.append(i, s); b.onclick = () => choose(st, j); return b;
    }));
    $("pnext").textContent = pstep === PROFILE.length - 1 ? tx.pfinish : tx.pnext;
    $("pnext").disabled = st.type === "multi" ? !(sel && sel.length) : sel === undefined;
  }
  function choose(st, j) {
    if (st.type === "multi") {
      const s = new Set(A[st.id] || []); s.has(j) ? s.delete(j) : s.add(j);
      const excl = st.excl || [];
      if (excl.includes(j) && s.has(j)) { s.clear(); s.add(j); } else if (!excl.includes(j)) excl.forEach(x => s.delete(x));
      A[st.id] = [...s];
    } else A[st.id] = j;
    const sel = A[st.id];
    $("popts").querySelectorAll(".popt").forEach((b, k) => { const on = st.type === "multi" ? sel.includes(k) : sel === k; b.classList.toggle("sel", on); b.setAttribute("aria-pressed", on); });
    $("pnext").disabled = st.type === "multi" ? !sel.length : false;
  }
  $("pnext").onclick = () => {
    if (pstep < PROFILE.length - 1) { pstep++; renderProfile(); return; }
    show("loading");
    const ul = $("lsteps"); ul.replaceChildren(...t().lsteps.map(s => { const li = document.createElement("li"); li.textContent = s; return li; }));
    const fast = matchMedia("(prefers-reduced-motion: reduce)").matches;
    [...ul.children].forEach((li, i) => setTimeout(() => li.classList.add("on"), fast ? 0 : 450 * (i + 1)));
    setTimeout(() => { renderPlan(); show("plan"); }, fast ? 300 : 1900);
  };

  // ---------- Pla ----------
  function renderPlan() {
    const tx = t();
    $("planTitle").textContent = tx.titles[A.sit ?? 0];
    const map = ["speak","exam","time"], icons = {listen:"ear",speak:"speech",write:"pen",exam:"check",time:"clock"};
    let keys = (A.pain || []).map(i => map[i]);
    if (A.sit === 3 && !keys.includes("exam")) keys.push("exam");
    if (!keys.includes("time")) keys.push("time");
    keys = [...new Set(keys)].slice(0, 3);
    $("how").replaceChildren(...keys.map(k => { const li = document.createElement("li"); const i = document.createElement("i"); i.innerHTML = svg(icons[k]); const s = document.createElement("span"); const b = document.createElement("b"); b.textContent = tx.how[k][0] + ": "; s.append(b, document.createTextNode(tx.how[k][1])); li.append(i, s); return li; }));

    const exams = (A.goal || []).filter(i => i <= 3).sort();
    const planFor = n => PLANS.find(p => p.count === Math.max(1, Math.min(4, n)));
    const levelsTxt = n => n === 4 ? tx.planAll : n === 1 ? tx.plan1 : fill(tx.planN, {n});
    let count, html;
    if (exams.length) {
      count = exams.length;
      const names = exams.map(i => LEVELS[i]);
      const l = names.length > 1 ? names.slice(0, -1).join(", ") + tx.join + names.at(-1) : names[0];
      html = fill(exams.length > 1 ? tx.recExamN : tx.recExam1, {l, p: planFor(count).title, n: levelsTxt(count)});
    } else if ((A.goal || []).includes(4)) { count = 2; html = fill(tx.recDaily, {p: planFor(2).title, n: levelsTxt(2)}); }
    else { count = 1; html = fill(tx.recUnsure, {p: planFor(1).title, n: levelsTxt(1)}); }
    const rec = planFor(count);
    $("rec").innerHTML = html;

    $("offer").classList.toggle("hide", !showOffer);
    $("preview").classList.toggle("hide", !preview);
    const last = new Date(Date.parse(OFFER.ends) - 1);
    $("offerSub").textContent = fill(tx.offerSub, {d: new Intl.DateTimeFormat(lang, {day: "numeric", month: "numeric", timeZone: "Europe/Andorra"}).format(last)});
    const eur = n => new Intl.NumberFormat(lang, {style: "currency", currency: "EUR"}).format(n);
    $("plans").replaceChildren(...[rec, ...PLANS.filter(p => p !== rec)].map(p => {
      const el = document.createElement("article"); el.className = "plan" + (p === rec ? " on" : "");
      if (p === rec) { const tg = document.createElement("span"); tg.className = "tag"; tg.textContent = tx.recTag; el.append(tg); }
      const h = document.createElement("h3"); h.textContent = p.title;
      const pr = document.createElement("span"); pr.className = "pr";
      if (showOffer) { const d = document.createElement("del"); d.textContent = eur(p.amount); pr.append(d); }
      pr.append(document.createTextNode(eur(showOffer ? OFFER.amounts[p.key] : p.amount)));
      const d = document.createElement("span"); d.className = "d"; d.textContent = levelsTxt(p.count) + " · " + fill(tx.months, {n: p.months});
      const a = document.createElement("a"); a.className = "btn" + (p === rec ? " big" : ""); a.textContent = ({es:"Continuar",ca:"Continua",fr:"Continuer",en:"Continue"})[lang]; a.setAttribute("aria-label", (p === rec ? tx.cta : tx.want) + " · " + p.title);
      if (preview) { a.setAttribute("aria-disabled", "true"); a.style.opacity = ".55"; a.style.pointerEvents = "none"; }
      else a.href = appUrl({checkout: "1", plan: p.key, level: exams.length ? LEVELS[exams[0]] : null, promo: offerLive ? "PRIMERS20" : null});
      el.append(h, pr, d, a); return el;
    }));
    $("free").href = appUrl({level: LEVELS[exams[0] ?? 0]});
  }

  // ---------- Idioma ----------
  function applyTexts() {
    document.documentElement.lang = lang; $("lang").value = lang;
    document.querySelectorAll("[data-t]").forEach(e => { e.textContent = t()[e.dataset.t]; });
    $("skip").href = appUrl();
    renderIntro();
    if (screen === "q") renderQ();
    if (screen === "score") renderScore();
    if (screen === "profile") renderProfile();
    if (screen === "plan") renderPlan();
  }
  /* Música de fons: només sona després de tocar «A jugar!»; el botó la silencia (es recorda). */
  const bgm = $("bgm"); bgm.volume = 0.20;
  let soundOn = true; try { soundOn = localStorage.getItem("acat_sound") !== "off"; } catch (e) {}
  function paintSound() { $("sound").setAttribute("aria-pressed", soundOn); $("sndOn").style.display = soundOn ? "" : "none"; $("sndOff").style.display = soundOn ? "none" : ""; }
  function music(play) { if (play && soundOn) bgm.play().catch(() => {}); else bgm.pause(); }
  /* Efectes: ruleta, encert, fallada i victòria. Es carreguen en tocar «A jugar!». */
  const SFX = {}; const SFX_VOL = {ruleta: .7, acierto: .8, fallo: 1, victoria: .9};
  function loadSfx() { Object.keys(SFX_VOL).forEach(k => { if (!SFX[k]) { const a = new Audio("/assets/ruleta/" + (k === "victoria" ? "victoria-eleven" : k === "fallo" ? "fallo-eleven" : k) + ".mp3"); a.preload = "auto"; a.volume = SFX_VOL[k]; SFX[k] = a; } }); }
  function sfx(k) { if (!soundOn || !SFX[k]) return; try { SFX[k].currentTime = 0; SFX[k].play().catch(() => {}); } catch (e) {} }
  $("sound").onclick = () => { soundOn = !soundOn; try { localStorage.setItem("acat_sound", soundOn ? "on" : "off"); } catch (e) {} paintSound(); music(soundOn && ["q", "score"].includes(screen)); };
  paintSound();
  $("start").onclick = () => { loadSfx(); reset(); renderQ(); show("q"); music(true); };
  $("lang").addEventListener("change", e => { lang = e.target.value; try { localStorage.setItem("acat_lang", lang); } catch (x) {} applyTexts(); });
  applyTexts();
})();
</script>
</body>
</html>
