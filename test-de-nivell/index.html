<meta property="og:url" content="https://aprencat.com/test-de-nivell/">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap">
<style>
:root{--navy:#0B2D6B;--navy-2:#123A82;--groc:#F6C86B;--corall:#F28B6B;--lavanda:#A7B6E8;--crema:#FFF6E7;--ink:#14213F;--muted:#5E6B8C;--line:#E5E9F3;--ok:#2E8B57;--ok-bg:#E8F5EE;--ko:#C2462A;--ko-bg:#FDEDE8;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Sora",-apple-system,system-ui,sans-serif;font-size:17px;line-height:1.55;
 background:radial-gradient(900px 520px at 12% -6%,rgba(167,182,232,.30),transparent 62%),radial-gradient(760px 460px at 92% 4%,rgba(246,200,107,.22),transparent 60%),#FBFCFE;background-attachment:fixed;padding:0 16px 40px}
.wrap{max-width:620px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0}
header img{height:28px;width:auto;display:block}
select{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:8px 14px;background:#fff;color:var(--ink)}
.card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:28px 22px;box-shadow:0 10px 30px rgba(20,33,63,.06)}
h1{margin:6px 0 12px;font-size:clamp(28px,7vw,40px);line-height:1.12;letter-spacing:-.02em;color:var(--navy);text-wrap:balance}
h2{margin:0 0 6px;font-size:clamp(20px,5vw,25px);line-height:1.25;color:var(--navy);text-wrap:balance}
.kicker{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted);margin:0 0 22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-size:16px;font-weight:700;border:0;border-radius:16px;padding:16px 26px;cursor:pointer;background:var(--navy);color:#fff;text-decoration:none;width:100%}
.btn:hover{background:var(--navy-2)}
.btn:disabled{background:#C9D0E2;cursor:default}
.btn.corall{background:var(--corall);color:var(--ink)}
.link{display:block;margin-top:16px;text-align:center;color:var(--muted);font-size:15px;font-weight:600}
.hide{display:none!important}
/* Progrés */
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:4px 0 22px}
.bar i{display:block;height:100%;width:0;background:var(--navy);border-radius:99px;transition:width .35s ease}
.meta{display:flex;justify-content:space-between;font-size:14px;font-weight:600;color:var(--muted)}
.lvl{display:inline-block;font-size:13px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--crema);color:var(--navy)}
.hint{font-size:15px;font-weight:600;color:var(--muted);margin:0 0 6px}
.q{font-size:clamp(20px,5.2vw,24px);font-weight:700;line-height:1.35;margin:0 0 20px}
.opts{display:grid;gap:12px}
.opt{font:inherit;font-size:17px;text-align:left;padding:16px 18px;border-radius:16px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.opt:hover{border-color:var(--lavanda)}
.opt.sel{border-color:var(--navy);background:#EEF1FA}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ko{border-color:var(--ko);background:var(--ko-bg)}
.opt:disabled{cursor:default}
.fb{margin:18px 0 0;padding:16px 18px;border-radius:16px;font-size:15px;min-height:0}
.fb b{display:block;font-size:17px;margin-bottom:2px}
.fb.ok{background:var(--ok-bg)}.fb.ok b{color:var(--ok)}
.fb.ko{background:var(--ko-bg)}.fb.ko b{color:var(--ko)}
.actions{margin-top:20px}
/* Resultat */
.result{text-align:center}
.result .kicker{display:block}
.badge-lvl{display:inline-grid;place-items:center;width:132px;height:132px;border-radius:50%;background:var(--navy);color:var(--groc);font-size:46px;font-weight:800;margin:10px auto 14px;box-shadow:0 0 0 10px var(--crema)}
.score{font-weight:700;color:var(--navy);margin:0 0 6px}
.small{font-size:13px;color:var(--muted);margin:8px 0 0}
.rec{margin:22px 0 0;padding:16px 18px;border-radius:18px;background:var(--crema);text-align:left;font-size:16px}
/* Oferta */
.offer{margin-top:22px}
.bf{background:var(--navy);border-radius:28px;padding:24px 22px;color:#fff;text-align:center;margin-bottom:16px}
.bf .t{font-size:clamp(28px,8vw,42px);font-weight:800;line-height:1.05;letter-spacing:-.02em}
.bf .t span:nth-child(1){color:var(--groc)}.bf .t span:nth-child(2){color:var(--corall)}
.bf .s{margin-top:8px;font-weight:700;color:var(--lavanda);font-size:15px;letter-spacing:.04em}
.plans{display:grid;gap:12px}
.plan{position:relative;background:#fff;border:2px solid var(--line);border-radius:20px;padding:18px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.plan.rec-on{border-color:var(--navy);box-shadow:0 8px 24px rgba(11,45,107,.14)}
.plan .tag{grid-column:1/-1;justify-self:start;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--groc);color:var(--navy);border-radius:99px;padding:3px 10px;margin-bottom:4px}
.plan h3{margin:0;font-size:19px;color:var(--navy)}
.plan .d{font-size:14px;color:var(--muted);grid-column:1}
.plan .p{grid-row:span 2;text-align:right;font-weight:800;font-size:21px;color:var(--navy);white-space:nowrap}
.plan .p del{display:block;font-size:14px;font-weight:600;color:var(--muted)}
.plan .btn{grid-column:1/-1;margin-top:12px;padding:13px 18px;font-size:15px}
.plan:not(.rec-on) .btn{background:#EEF1FA;color:var(--navy)}
.once{text-align:center;font-size:14px;font-weight:600;color:var(--muted);margin:14px 0 0}
.preview{background:var(--groc);color:var(--navy);font-weight:800;text-align:center;border-radius:12px;padding:8px;margin-bottom:12px;font-size:14px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <a href="/" aria-label="AprènCat"><img src="/assets/acat-wordmark.png" alt="AprènCat" width="100" height="28"></a>
  <select id="lang" aria-label="Idioma">
    <option value="es">Español</option><option value="ca">Català</option><option value="fr">Français</option><option value="en">English</option>
  </select>
</header>

<main class="card" aria-live="polite">
  <!-- Inici -->
  <section id="s-intro">
    <span class="kicker" data-t="kicker"></span>
    <h1 data-t="h1"></h1>
    <p class="lead" data-t="lead"></p>
    <button class="btn corall" id="start" data-t="start"></button>
    <a class="link" id="skip" data-t="skip"></a>
  </section>

  <!-- Preguntes -->
  <section id="s-quiz" class="hide">
    <div class="meta"><span id="count"></span><span class="lvl" id="qlvl"></span></div>
    <div class="bar"><i id="prog"></i></div>
    <p class="hint" id="hint"></p>
    <p class="q" id="q" lang="ca"></p>
    <div class="opts" id="opts"></div>
    <div class="fb hide" id="fb" role="status"></div>
    <div class="actions"><button class="btn" id="next" disabled></button></div>
  </section>

  <!-- Resultat i oferta -->
  <section id="s-result" class="hide">
    <div class="result">
      <span class="kicker" data-t="yourLevel"></span>
      <div class="badge-lvl" id="rlvl"></div>
      <h2 id="rtitle"></h2>
      <p class="score" id="rscore"></p>
      <p class="small" data-t="disclaimer"></p>
    </div>
    <div class="rec" id="rec"></div>
    <div class="offer">
      <div class="preview hide" id="preview" data-t="preview"></div>
      <div class="bf hide" id="bf"><div class="t"><span>Black</span> <span>Friday</span></div><div class="t" style="color:#fff">−30 %</div><div class="s" id="bfs"></div></div>
      <h2 id="offerTitle" class="hide" data-t="offerRegular"></h2>
      <div class="plans" id="plans"></div>
      <p class="once" data-t="once"></p>
      <a class="link" id="free" data-t="free"></a>
    </div>
  </section>
</main>
</div>

<script>
(() => {
  /* Preus i dates: els mateixos que la portada i supabase/functions/_shared/web-products.ts. */
  const PLANS = [
    {key:"BASIC", title:"Bàsic", amount:59.99, months:6, count:1},
    {key:"DUO", title:"Duo", amount:99.99, months:12, count:2},
    {key:"TRIPLE", title:"Trio", amount:129.99, months:18, count:3},
    {key:"ALL", title:"Complet", amount:159.99, months:24, count:4}
  ];
  const SALE = {starts:"2026-11-23T00:00:00+01:00", ends:"2026-12-01T00:00:00+01:00", amounts:{BASIC:41.99, DUO:69.99, TRIPLE:89.99, ALL:109.99}};
  const params = new URLSearchParams(location.search);
  const now = Date.now();
  const saleLive = now >= Date.parse(SALE.starts) && now < Date.parse(SALE.ends);
  /* ?bf=preview: només per revisar el disseny. Mostra l'oferta però desactiva la compra. */
  const preview = !saleLive && params.get("bf") === "preview";
  const showSale = saleLive || preview;
  const LEVELS = ["A1","A2","B1","B2"];

  /* Preguntes sempre en català; l'explicació, en l'idioma d'ajuda. La resposta correcta és la primera (es barregen en mostrar-les). */
  const QUESTIONS = [
    {lvl:0, q:"A la recepció del metge et pregunten: «Com et dius?»", o:["Em dic Laura.","Tinc trenta anys.","Visc a Escaldes."],
     e:{es:"«Com et dius?» pregunta tu nombre: «Em dic…» = «Me llamo…».",ca:"«Com et dius?» pregunta el nom: es respon «Em dic…».",fr:"« Com et dius ? » demande ton prénom : « Em dic… » = « Je m’appelle… ».",en:"“Com et dius?” asks your name: “Em dic…” = “My name is…”."}},
    {lvl:0, q:"Al forn: «Bon dia! Què li poso?» — «___ una barra de pa, si us plau.»", o:["Voldria","Sóc","Tinc"],
     e:{es:"«Voldria» (querría) es la forma educada de pedir algo.",ca:"«Voldria» és la manera educada de demanar alguna cosa.",fr:"« Voldria » (je voudrais) est la façon polie de demander quelque chose.",en:"“Voldria” (I would like) is the polite way to ask for something."}},
    {lvl:1, q:"Ahir ___ al comú a demanar un certificat.", o:["vaig anar","aniré","vaig"],
     e:{es:"Para el pasado se usa «vaig + infinitivo»: «vaig anar» = «fui».",ca:"Per parlar del passat fem servir «vaig + infinitiu»: «vaig anar».",fr:"Pour le passé, on utilise « vaig + infinitif » : « vaig anar » = « je suis allé(e) ».",en:"For the past, Catalan uses “vaig + infinitive”: “vaig anar” = “I went”."}},
    {lvl:1, q:"—Perdoni, on és la farmàcia? —És ___ del banc, a l’altra banda del carrer.", o:["davant","dins","sota"],
     e:{es:"«Davant de» = «enfrente de».",ca:"«Davant de» vol dir que és de cara, a l’altra banda.",fr:"« Davant de » = « en face de ».",en:"“Davant de” = “opposite”."}},
    {lvl:2, q:"Si ___ més temps, aniria a classes de cuina.", o:["tingués","tinc","tindré"],
     e:{es:"Con «si» y el condicional «aniria» va el imperfecto de subjuntivo: «tingués» = «tuviera».",ca:"Amb «si» i el condicional «aniria», cal l’imperfet de subjuntiu: «tingués».",fr:"Avec « si » et le conditionnel « aniria », on utilise le subjonctif imparfait : « tingués ».",en:"With “si” and the conditional “aniria”, Catalan uses the imperfect subjunctive: “tingués”."}},
    {lvl:2, q:"—Has portat els documents? —Sí, ___ he portat tots.", o:["els","les","li"],
     e:{es:"«Els documents» es masculino plural, así que el pronombre es «els».",ca:"«Els documents» és masculí plural: el pronom és «els».",fr:"« Els documents » est masculin pluriel : le pronom est « els ».",en:"“Els documents” is masculine plural, so the pronoun is “els”."}},
    {lvl:3, q:"No crec que l’examen ___ tan difícil com diuen.", o:["sigui","és","serà"],
     e:{es:"Después de «no crec que» va subjuntivo: «sigui» = «sea».",ca:"Després de «no crec que» va el subjuntiu: «sigui».",fr:"Après « no crec que », on emploie le subjonctif : « sigui ».",en:"After “no crec que” (I don’t think that), Catalan uses the subjunctive: “sigui”."}},
    {lvl:3, q:"—Li has donat les claus a la Marta? —Sí, ja ___ he donat.", o:["les hi","li les","els hi"],
     e:{es:"Se combinan dos pronombres: «les» (las llaves) + «li» (a ella), que pasa a «hi»: «les hi».",ca:"Combinem «les» (les claus) i «li», que davant d’un altre pronom fa «hi»: «les hi».",fr:"On combine « les » (les clés) et « li » (à elle), qui devient « hi » : « les hi ».",en:"Two pronouns combine: “les” (the keys) + “li” (to her), which becomes “hi”: “les hi”."}}
  ];

  const T = {
    es:{kicker:"Test de nivel · gratis",h1:"¿Qué nivel de catalán tienes?",lead:"Descúbrelo en 1 minuto con 8 preguntas del día a día en Andorra. Al final te decimos qué curso necesitas.",start:"Empezar el test",skip:"Prefiero empezar directamente la primera unidad gratis",
      hint:"Elige la respuesta correcta",count:"Pregunta {n} de {t}",check:"Comprobar",next:"Siguiente",finish:"Ver mi resultado",right:"Molt bé!",wrong:"Gairebé!",correctIs:"La correcta es: {a}.",
      goalQ:"¿Qué examen oficial quieres aprobar?",goalHint:"Última pregunta",unsure:"Aún no lo sé",
      yourLevel:"Tu nivel estimado",score:"Has acertado {n} de {t}",disclaimer:"Es una estimación orientativa, no una prueba oficial.",
      titles:["Estás empezando: ¡buen momento!","Ya te defiendes en lo básico","Te comunicas en el día a día","Tienes un nivel avanzado"],
      recGoal:"Para llegar al <b>{t}</b> te recomendamos el plan <b>{p}</b>: {lv}.",recAbove:"Ya estás muy cerca del <b>{t}</b>. Con el plan <b>{p}</b> lo preparas a fondo, con modelos de examen y simulacros.",recNext:"Tu siguiente paso es el <b>{n}</b>. Te recomendamos el plan <b>{p}</b> para empezar.",
      levelsWord:"curso {l}",bfSub:"En todos los planes · hasta el 30/11",offerRegular:"Elige tu plan",recTag:"Recomendado para ti",want:"Quiero este plan",
      plan1:"1 nivel",planN:"{n} niveles",planAll:"A1, A2, B1 y B2",months:"{n} meses",once:"Pago único, sin renovaciones. La misma cuenta en la web y en la app.",free:"Seguir gratis con la primera unidad (sin tarjeta)",preview:"VISTA PREVIA · la oferta empieza el 23/11 · compra desactivada"},
    ca:{kicker:"Test de nivell · gratis",h1:"Quin nivell de català tens?",lead:"Descobreix-ho en 1 minut amb 8 preguntes del dia a dia a Andorra. Al final et diem quin curs necessites.",start:"Comença el test",skip:"Prefereixo començar directament la primera unitat gratis",
      hint:"Tria la resposta correcta",count:"Pregunta {n} de {t}",check:"Comprova",next:"Següent",finish:"Veure el meu resultat",right:"Molt bé!",wrong:"Gairebé!",correctIs:"La correcta és: {a}.",
      goalQ:"Quin examen oficial vols aprovar?",goalHint:"Última pregunta",unsure:"Encara no ho sé",
      yourLevel:"El teu nivell estimat",score:"Has encertat {n} de {t}",disclaimer:"És una estimació orientativa, no una prova oficial.",
      titles:["Estàs començant: és un bon moment!","Ja et defenses en el més bàsic","Et comuniques en el dia a dia","Tens un nivell avançat"],
      recGoal:"Per arribar al <b>{t}</b> et recomanem el pla <b>{p}</b>: {lv}.",recAbove:"Ja ets molt a prop del <b>{t}</b>. Amb el pla <b>{p}</b> el prepares a fons, amb models d’examen i simulacres.",recNext:"El teu pas següent és el <b>{n}</b>. Et recomanem el pla <b>{p}</b> per començar.",
      levelsWord:"curs {l}",bfSub:"En tots els plans · fins al 30/11",offerRegular:"Tria el teu pla",recTag:"Recomanat per a tu",want:"Vull aquest pla",
      plan1:"1 nivell",planN:"{n} nivells",planAll:"A1, A2, B1 i B2",months:"{n} mesos",once:"Pagament únic, sense renovacions. El mateix compte a la web i a l’app.",free:"Continua gratis amb la primera unitat (sense targeta)",preview:"VISTA PRÈVIA · l’oferta comença el 23/11 · compra desactivada"},
    fr:{kicker:"Test de niveau · gratuit",h1:"Quel est ton niveau de catalan ?",lead:"Découvre-le en 1 minute avec 8 questions de la vie quotidienne en Andorre. À la fin, on te dit quel cours il te faut.",start:"Commencer le test",skip:"Je préfère commencer directement la première unité gratuite",
      hint:"Choisis la bonne réponse",count:"Question {n} sur {t}",check:"Vérifier",next:"Suivant",finish:"Voir mon résultat",right:"Molt bé !",wrong:"Presque !",correctIs:"La bonne réponse : {a}.",
      goalQ:"Quel examen officiel veux-tu réussir ?",goalHint:"Dernière question",unsure:"Je ne sais pas encore",
      yourLevel:"Ton niveau estimé",score:"{n} bonnes réponses sur {t}",disclaimer:"C’est une estimation indicative, pas un examen officiel.",
      titles:["Tu débutes : c’est le bon moment !","Tu te débrouilles déjà dans les bases","Tu communiques au quotidien","Tu as un niveau avancé"],
      recGoal:"Pour atteindre le <b>{t}</b>, on te recommande la formule <b>{p}</b> : {lv}.",recAbove:"Tu es déjà très proche du <b>{t}</b>. Avec la formule <b>{p}</b>, tu le prépares à fond, avec des modèles d’examen et des simulations.",recNext:"Ta prochaine étape est le <b>{n}</b>. On te recommande la formule <b>{p}</b> pour commencer.",
      levelsWord:"cours {l}",bfSub:"Sur toutes les formules · jusqu’au 30/11",offerRegular:"Choisis ta formule",recTag:"Recommandé pour toi",want:"Je veux cette formule",
      plan1:"1 niveau",planN:"{n} niveaux",planAll:"A1, A2, B1 et B2",months:"{n} mois",once:"Paiement unique, sans renouvellement. Le même compte sur le web et dans l’app.",free:"Continuer gratuitement avec la première unité (sans carte)",preview:"APERÇU · l’offre commence le 23/11 · achat désactivé"},
    en:{kicker:"Level test · free",h1:"What’s your Catalan level?",lead:"Find out in 1 minute with 8 everyday questions from life in Andorra. At the end we’ll tell you which course you need.",start:"Start the test",skip:"I’d rather start the first free unit right away",
      hint:"Choose the right answer",count:"Question {n} of {t}",check:"Check",next:"Next",finish:"See my result",right:"Molt bé!",wrong:"Almost!",correctIs:"The right answer is: {a}.",
      goalQ:"Which official exam do you want to pass?",goalHint:"Last question",unsure:"I’m not sure yet",
      yourLevel:"Your estimated level",score:"You got {n} out of {t} right",disclaimer:"This is a rough estimate, not an official exam.",
      titles:["You’re just starting: great timing!","You can already handle the basics","You get by in everyday life","You have an advanced level"],
      recGoal:"To reach <b>{t}</b> we recommend the <b>{p}</b> plan: {lv}.",recAbove:"You’re already very close to <b>{t}</b>. With the <b>{p}</b> plan you’ll prepare it thoroughly, with mock exams.",recNext:"Your next step is <b>{n}</b>. We recommend the <b>{p}</b> plan to get started.",
      levelsWord:"{l} course",bfSub:"On every plan · until 30/11",offerRegular:"Choose your plan",recTag:"Recommended for you",want:"I want this plan",
      plan1:"1 level",planN:"{n} levels",planAll:"A1, A2, B1 and B2",months:"{n} months",once:"One-off payment, no renewals. One account for the web and the app.",free:"Continue for free with the first unit (no card)",preview:"PREVIEW · the offer starts on 23/11 · purchase disabled"}
  };

  const $ = id => document.getElementById(id);
  const fill = (s, v) => Object.entries(v).reduce((t, [k, x]) => t.split("{" + k + "}").join(x), s);
  const pick = v => v && Object.hasOwn(T, v.toLowerCase().split(/[-_]/)[0]) ? v.toLowerCase().split(/[-_]/)[0] : null;
  let saved = null; try { saved = localStorage.getItem("acat_lang"); } catch (e) {}
  let lang = pick(params.get("lang")) || pick(saved) || (navigator.languages || [navigator.language]).map(pick).find(Boolean) || "es";
  const t = () => T[lang];

  /* Enllaços a l'app: conserven l'idioma, el nivell recomanat i les UTM dels anuncis. */
  function appUrl(extra) {
    const u = new URL("https://app.aprencat.com/");
    u.searchParams.set("trial", "1"); u.searchParams.set("lang", lang);
    for (const [k, v] of params) if (k.startsWith("utm_")) u.searchParams.set(k, v);
    if (!params.has("utm_source")) { u.searchParams.set("utm_source", "aprencat.com"); u.searchParams.set("utm_campaign", "test-nivell"); }
    Object.entries(extra || {}).forEach(([k, v]) => v && u.searchParams.set(k, v));
    return u.href;
  }

  // Estat
  const order = QUESTIONS.map((q, i) => ({...q, opts: q.o.map((text, j) => ({text, right: j === 0})).sort(() => Math.random() - .5), i}));
  const TOTAL = order.length + 1; // + objectiu
  let step = 0, chosen = null, answered = false, correct = 0;
  const byLevel = [0,0,0,0];
  let goal = null; // 0-3 o -1

  function applyTexts() {
    document.documentElement.lang = lang;
    $("lang").value = lang;
    document.querySelectorAll("[data-t]").forEach(e => { e.textContent = t()[e.dataset.t]; });
    $("skip").href = appUrl();
    if (!$("s-quiz").classList.contains("hide")) renderStep(true);
    if (!$("s-result").classList.contains("hide")) renderResult();
  }

  function show(id) { ["s-intro","s-quiz","s-result"].forEach(s => $(s).classList.toggle("hide", s !== id)); window.scrollTo({top:0}); }

  function renderStep(keep) {
    const tx = t();
    $("count").textContent = step < order.length ? fill(tx.count, {n: step + 1, t: order.length}) : "";
    $("prog").style.width = (step / TOTAL * 100) + "%";
    const opts = $("opts");
    if (step < order.length) {
      const q = order[step];
      $("qlvl").textContent = LEVELS[q.lvl]; $("qlvl").classList.remove("hide");
      $("hint").textContent = tx.hint;
      $("q").textContent = q.q; $("q").lang = "ca";
      if (!keep) {
        opts.replaceChildren(...q.opts.map((o, j) => { const b = document.createElement("button"); b.className = "opt"; b.lang = "ca"; b.textContent = o.text; b.dataset.j = j; b.onclick = () => choose(j); return b; }));
        $("fb").classList.add("hide");
      } else if (answered) feedback(q);
      $("next").textContent = answered ? tx.next : tx.check;
    } else {
      $("qlvl").classList.add("hide");
      $("hint").textContent = tx.goalHint;
      $("q").textContent = tx.goalQ; $("q").lang = lang;
      const vals = [0,1,2,3,-1];
      opts.replaceChildren(...vals.map(v => { const b = document.createElement("button"); b.className = "opt" + (goal === v ? " sel" : ""); b.textContent = v < 0 ? tx.unsure : LEVELS[v]; b.onclick = () => { goal = v; opts.querySelectorAll(".opt").forEach(x => x.classList.toggle("sel", x === b)); $("next").disabled = false; }; return b; }));
      $("fb").classList.add("hide");
      $("next").textContent = tx.finish; $("next").disabled = goal === null;
    }
  }

  function choose(j) {
    if (answered) return;
    chosen = j;
    $("opts").querySelectorAll(".opt").forEach(b => b.classList.toggle("sel", +b.dataset.j === j));
    $("next").disabled = false;
  }

  function feedback(q) {
    const tx = t(), right = q.opts[chosen].right, ans = q.opts.find(o => o.right).text;
    $("opts").querySelectorAll(".opt").forEach(b => { b.disabled = true; const o = q.opts[+b.dataset.j]; b.classList.remove("sel"); if (o.right) b.classList.add("ok"); else if (+b.dataset.j === chosen) b.classList.add("ko"); });
    const fb = $("fb");
    fb.className = "fb " + (right ? "ok" : "ko");
    fb.innerHTML = "";
    const b = document.createElement("b"); b.lang = "ca"; b.textContent = right ? tx.right : tx.wrong; fb.append(b);
    if (!right) { const p = document.createElement("span"); p.textContent = fill(tx.correctIs, {a: "«" + ans + "»"}) + " "; fb.append(p); }
    const e = document.createElement("span"); e.textContent = q.e[lang] || q.e.es; fb.append(e);
  }

  $("next").onclick = () => {
    if (step < order.length) {
      const q = order[step];
      if (!answered) {
        if (chosen === null) return;
        answered = true;
        if (q.opts[chosen].right) { correct++; byLevel[q.lvl]++; }
        feedback(q); $("next").textContent = t().next; return;
      }
      step++; chosen = null; answered = false; $("next").disabled = true; renderStep(); return;
    }
    if (goal !== null) { $("prog").style.width = "100%"; renderResult(); show("s-result"); }
  };

  /* Nivell orientatiu segons els encerts (0–2 inicial, 3–4 A1, 5–6 A2, 7 B1, 8 B2).
     No es dona un nivell si s'han fallat les dues preguntes d'aquell nivell. */
  function estimate() {
    let reached = correct <= 2 ? -1 : correct <= 4 ? 0 : correct <= 6 ? 1 : correct === 7 ? 2 : 3;
    while (reached >= 0 && byLevel[reached] === 0) reached--;
    return reached; // -1 = inicial
  }

  function renderResult() {
    const tx = t(), reached = estimate();
    const nextLvl = Math.min(reached + 1, 3);
    $("rlvl").textContent = reached < 0 ? "A0" : LEVELS[reached];
    $("rtitle").textContent = tx.titles[Math.min(3, reached + 1)];
    $("rscore").textContent = fill(tx.score, {n: correct, t: order.length});

    // Pla recomanat segons el nivell i l'objectiu
    let count, html;
    const planFor = n => PLANS.find(p => p.count === Math.max(1, Math.min(4, n)));
    if (goal >= 0 && goal >= nextLvl) {
      count = goal - nextLvl + 1;
      const lv = LEVELS.slice(nextLvl, goal + 1).map(l => fill(tx.levelsWord, {l})).join(" + ");
      html = fill(tx.recGoal, {t: LEVELS[goal], p: planFor(count).title, lv});
    } else if (goal >= 0) {
      count = 1; html = fill(tx.recAbove, {t: LEVELS[goal], p: planFor(1).title});
    } else {
      count = 1; html = fill(tx.recNext, {n: LEVELS[nextLvl], p: planFor(1).title});
    }
    const rec = planFor(count);
    $("rec").innerHTML = html;

    // Oferta
    $("bf").classList.toggle("hide", !showSale);
    $("offerTitle").classList.toggle("hide", showSale);
    $("preview").classList.toggle("hide", !preview);
    $("bfs").textContent = tx.bfSub;
    const eur = n => new Intl.NumberFormat(lang, {style: "currency", currency: "EUR"}).format(n);
    const levelsTxt = n => n === 4 ? tx.planAll : n === 1 ? tx.plan1 : fill(tx.planN, {n});
    const list = [rec, ...PLANS.filter(p => p !== rec)];
    $("plans").replaceChildren(...list.map(p => {
      const el = document.createElement("article");
      el.className = "plan" + (p === rec ? " rec-on" : "");
      const price = showSale ? SALE.amounts[p.key] : p.amount;
      el.innerHTML = (p === rec ? `<span class="tag"></span>` : "") + `<h3></h3><span class="p">${showSale ? `<del>${eur(p.amount)}</del>` : ""}${eur(price)}</span><span class="d"></span><a class="btn"></a>`;
      if (p === rec) el.querySelector(".tag").textContent = tx.recTag;
      el.querySelector("h3").textContent = p.title;
      el.querySelector(".d").textContent = levelsTxt(p.count) + " · " + fill(tx.months, {n: p.months});
      const a = el.querySelector(".btn"); a.textContent = tx.want;
      if (preview) { a.removeAttribute("href"); a.setAttribute("aria-disabled", "true"); a.style.opacity = ".55"; a.style.pointerEvents = "none"; }
      else a.href = appUrl({plan: p.key, level: LEVELS[nextLvl]});
      return el;
    }));
    $("free").href = appUrl({level: LEVELS[nextLvl]});
  }

  $("start").onclick = () => { step = 0; renderStep(); show("s-quiz"); };
  $("lang").addEventListener("change", e => { lang = e.target.value; try { localStorage.setItem("acat_lang", lang); } catch (x) {} applyTexts(); });
  applyTexts();
})();
</script>
</body>
</html>
