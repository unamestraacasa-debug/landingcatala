    keys = [...new Set(keys)].slice(0, 4);
    const items = keys.map(k => { const li = document.createElement("li"); const b = document.createElement("b"); b.textContent = tx.how[k][0]; li.append(b, document.createTextNode(tx.how[k][1])); return li; });
    if (A.where && A.where.length) {
      const names = A.where.map(i => tx.q.where.o[i].toLowerCase());
      const w = names.length > 1 ? names.slice(0, -1).join(", ") + tx.whereJoin + names.at(-1) : names[0];
      const li = document.createElement("li"); const b = document.createElement("b"); b.textContent = fill(tx.where, {w}); li.append(b); items.unshift(li);
    }
    $("how").replaceChildren(...items);

    // Pla recomanat
    /* Exàmens triats (0–3). Tants nivells, tants al pla: 1 Bàsic, 2 Duo, 3 Trio, 4 Complet. */
    const exams = (A.goal || []).filter(i => i <= 3).sort();
    const planFor = n => PLANS.find(p => p.count === Math.max(1, Math.min(4, n)));
    const levelsTxt = n => n === 4 ? tx.planAll : n === 1 ? tx.plan1 : fill(tx.planN, {n});
    let count = 1, html;
    if (exams.length) {
      count = exams.length;
      const names = exams.map(i => LEVELS[i]);
      const l = names.length > 1 ? names.slice(0, -1).join(", ") + tx.whereJoin + names.at(-1) : names[0];
      html = fill(exams.length > 1 ? tx.recExamN : tx.recExam1, {l, p: planFor(count).title, n: levelsTxt(count)});
    } else {
      // Sense examen: per al dia a dia, dos nivells des del seu punt de partida; si no ho sap, un.
      count = (A.goal || []).includes(4) ? Math.min(2, 4 - s0) : 1;
      html = fill(tx.recNext, {s: LEVELS[s0], p: planFor(count).title});
    }
    const rec = planFor(count);
    $("rec").innerHTML = html;

    $("bf").classList.toggle("hide", !showSale);
    $("offerTitle").classList.toggle("hide", showSale);
    $("preview").classList.toggle("hide", !preview);
    $("bfs").textContent = tx.bfSub;
    const eur = n => new Intl.NumberFormat(lang, {style: "currency", currency: "EUR"}).format(n);
    $("plans").replaceChildren(...[rec, ...PLANS.filter(p => p !== rec)].map(p => {
      const el = document.createElement("article");
      el.className = "plan" + (p === rec ? " rec-on" : "");
      const price = showSale ? SALE.amounts[p.key] : p.amount;
      el.innerHTML = (p === rec ? `<span class="tag"></span>` : "") + `<h3></h3><span class="p">${showSale ? `<del>${eur(p.amount)}</del>` : ""}${eur(price)}</span><span class="d"></span><a class="btn"></a>`;
      if (p === rec) el.querySelector(".tag").textContent = tx.recTag;
      el.querySelector("h3").textContent = p.title;
      el.querySelector(".d").textContent = levelsTxt(p.count) + " · " + fill(tx.months, {n: p.months});
      const a = el.querySelector(".btn"); a.textContent = tx.want;
      if (preview) { a.setAttribute("aria-disabled", "true"); a.style.opacity = ".55"; a.style.pointerEvents = "none"; }
      else a.href = appUrl({plan: p.key, level: LEVELS[s0]});
      return el;
    }));
    $("free").href = appUrl({level: LEVELS[s0]});
  }

  $("start").onclick = () => { step = 0; renderStep(); show("s-quiz"); };
  $("lang").addEventListener("change", e => { lang = e.target.value; try { localStorage.setItem("acat_lang", lang); } catch (x) {} applyTexts(); });
  applyTexts();
})();
</script>
</body>
</html>
