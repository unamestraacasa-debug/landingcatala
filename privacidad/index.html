<script>
// La política de privacitat i els termes viuen ara a app.aprencat.com/privacitat/<idioma>/.
// Portem el visitant a la versió del seu idioma (el triat a la portada o el del navegador).
(function () {
  var ok = ["ca", "es", "en", "fr", "pt", "it", "ru", "zh", "ar"], l = null;
  try { l = localStorage.getItem("acat_lang"); } catch (e) {}
  if (!l || ok.indexOf(l) < 0) {
    var langs = navigator.languages || [navigator.language || "es"];
    for (var i = 0; i < langs.length && (!l || ok.indexOf(l) < 0); i++) l = String(langs[i]).toLowerCase().split(/[-_]/)[0];
  }
  if (ok.indexOf(l) < 0) l = "es";
  location.replace("https://app.aprencat.com/privacitat/" + l + "/" + location.hash);
})();
</script>
