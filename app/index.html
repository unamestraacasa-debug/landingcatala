<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B2D6B">
<title>Descarrega AprènCat</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0B2D6B;--deep:#071E4A;--sky:#1F4A9C;--yellow:#F6C86B;--ink:#0E1B33;--muted:#5B6B82;--line:#DCE3F1;
        --green:#1F8A5B;--blue:#2563D0;--red:#C62D33;--black:#16191F}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{min-height:100svh;font-family:Sora,system-ui,-apple-system,sans-serif;color:#fff;
       background:linear-gradient(180deg,var(--deep) 0%,var(--navy) 45%,var(--sky) 100%);overflow-x:hidden}
  .page{position:relative;z-index:1;min-height:100svh;max-width:1040px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 22px 230px;
        display:grid;grid-template-columns:1fr;gap:30px;align-items:center}
  .intro{text-align:center}
  .logo{width:132px;height:auto;display:block;margin:0 auto 20px}
  h1{font-size:clamp(34px,8.6vw,54px);line-height:1.04;letter-spacing:-1.2px;margin:0 0 14px;font-weight:800}
  .lead{font-size:17px;line-height:1.55;color:#D7E0F5;margin:0 auto 26px;max-width:30ch}
  .stores{display:grid;gap:14px;width:min(360px,100%);margin:0 auto}
  .store{position:relative;display:flex;align-items:center;gap:16px;padding:14px 20px;border-radius:20px;background:#fff;color:var(--ink);
         text-decoration:none;box-shadow:0 14px 34px rgba(4,16,44,.35);transition:transform .15s ease,box-shadow .15s ease}
  .store:hover{transform:translateY(-2px);box-shadow:0 18px 40px rgba(4,16,44,.45)}
  .store:active{transform:translateY(0) scale(.99)}
  .store:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
  .store svg{width:34px;height:34px;flex:none}
  .store .t{display:grid;text-align:left;line-height:1.15}
  .store small{font-size:13px;font-weight:600;color:var(--muted)}
  .store b{font-size:22px;font-weight:800;letter-spacing:-.3px}
  .store.mine{outline:3px solid var(--yellow);outline-offset:0}
  .tag{position:absolute;top:-11px;right:16px;background:var(--yellow);color:var(--navy);font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px}
  .opening{margin:18px auto 0;display:none;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 12px;font-size:15px;color:#E3E9F8}
  .opening.on{display:flex}
  .ring{width:30px;height:30px;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:4}
  .ring .bg{stroke:rgba(255,255,255,.2)}
  .ring .fg{stroke:var(--yellow);stroke-linecap:round;stroke-dasharray:82;stroke-dashoffset:0}
  .opening.on .ring .fg{animation:drain 3s linear forwards}
  @keyframes drain{to{stroke-dashoffset:82}}
  #openingText{white-space:nowrap}
  .stay{background:none;border:0;color:var(--yellow);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:6px}
  .desk{display:none;margin:26px auto 0;align-items:center;gap:16px;width:min(360px,100%);text-align:left}
  .qr{background:#fff;border-radius:16px;padding:10px;flex:none}
  .qr svg{display:block;width:92px;height:92px}
  .desk p{margin:0;font-size:15px;line-height:1.45;color:#D7E0F5}
  .web{display:inline-block;margin-top:22px;color:#fff;font-size:15px;text-decoration:underline;text-underline-offset:3px;opacity:.85}
  .phone{justify-self:center;width:min(250px,62vw);aspect-ratio:9/19;border-radius:38px;background:#0E1B33;padding:9px;
         box-shadow:0 30px 70px rgba(4,16,44,.55),inset 0 0 0 2px rgba(255,255,255,.08);rotate:-4deg}
  .phone img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:30px;display:block}
  .hills{position:fixed;left:0;right:0;bottom:0;height:max(260px,24vw);z-index:0;pointer-events:none}
  .hills svg{width:100%;height:100%;display:block}
  @media (min-width:860px){
    .page{grid-template-columns:1.1fr .9fr;padding-top:60px;gap:40px}
    .intro{text-align:left}.logo{margin:0 0 24px}.lead{margin-left:0}.stores,.desk{margin-left:0}
    .phone{width:280px}
  }
  body.is-desktop .desk{display:flex}
  @media (prefers-reduced-motion:reduce){.store{transition:none}.opening.on .ring .fg{animation:none}}
</style>
</head>

<script>
(function(){
  var T={
    ca:{title:"Descarrega AprènCat",lead:"El curs de català per viure a Andorra, de l’A1 al B2. La primera unitat és gratis.",ios:"Descarrega-la a",android:"Disponible a",mine:"El teu mòbil",opening:"Obrint {s} en {n} s",stay:"Queda’t aquí",qr:"Escaneja el codi amb el mòbil i t’obrirà la botiga que toca.",web:"O fes el curs al navegador, a app.aprencat.com"},
    es:{title:"Descarga AprènCat",lead:"El curso de catalán para vivir en Andorra, del A1 al B2. La primera unidad es gratis.",ios:"Descárgala en",android:"Disponible en",mine:"Tu móvil",opening:"Abriendo {s} en {n} s",stay:"Quedarme aquí",qr:"Escanea el código con el móvil y se abrirá la tienda que toca.",web:"O haz el curso en el navegador, en app.aprencat.com"},
    en:{title:"Get AprènCat",lead:"The Catalan course for life in Andorra, from A1 to B2. The first unit is free.",ios:"Download on the",android:"Get it on",mine:"Your phone",opening:"Opening {s} in {n}s",stay:"Stay here",qr:"Scan the code with your phone to open the right store.",web:"Or take the course in your browser at app.aprencat.com"},
    fr:{title:"Télécharge AprènCat",lead:"Le cours de catalan pour vivre en Andorre, de l’A1 au B2. La première unité est gratuite.",ios:"Télécharger sur",android:"Disponible sur",mine:"Ton téléphone",opening:"Ouverture de {s} dans {n} s",stay:"Rester ici",qr:"Scanne le code avec ton téléphone pour ouvrir la bonne boutique.",web:"Ou suis le cours dans ton navigateur, sur app.aprencat.com"}
  };
  var q=new URLSearchParams(location.search).get("lang");
  var nav=(navigator.languages&&navigator.languages[0])||navigator.language||"ca";
  var lang=[q,nav].map(function(x){return (x||"").slice(0,2).toLowerCase();}).filter(function(x){return T[x];})[0]||"ca";
  var t=T[lang];document.documentElement.lang=lang;document.title=t.title;
  document.querySelectorAll("[data-t]").forEach(function(e){e.textContent=t[e.dataset.t];});
  var ua=navigator.userAgent||"";
  var isIOS=/iPhone|iPad|iPod/i.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  var isAndroid=/Android/i.test(ua);
  var utm=location.search.replace(/^\?/,"");
  if(!isIOS&&!isAndroid){document.body.classList.add("is-desktop");return;}
  /* Al mòbil: el botó del teu sistema va primer i destacat, i s'obre sol en 3 s si no el toques. */
  var mine=document.getElementById(isIOS?"ios":"android");var stores=document.getElementById("stores");
  stores.insertBefore(mine,stores.firstChild);mine.classList.add("mine");
  var tag=document.createElement("span");tag.className="tag";tag.textContent=t.mine;mine.appendChild(tag);
  var box=document.getElementById("opening"),txt=document.getElementById("openingText"),n=3,store=isIOS?"App Store":"Google Play";
  var timer=null;function paint(){txt.textContent=t.opening.replace("{s}",store).replace("{n}",n);}
  paint();box.classList.add("on");
  timer=setInterval(function(){n--;if(n<=0){clearInterval(timer);location.href=mine.href;}else paint();},1000);
  document.getElementById("stay").addEventListener("click",function(){clearInterval(timer);box.classList.remove("on");});
})();
</script>
